name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
      - run: node dist/cli.js demo --allow-mutation --no-color --output breakcurl-demo-output
      - run: npm pack --dry-run
      - name: Verify demo artifacts contain no canary secret
        run: '! grep -R "CANARY_SUPER_SECRET_123" breakcurl-demo-output'
